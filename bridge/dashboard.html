<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitburner dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --primary: #0b0b0b; --secondary: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --blue: #2a78d6; --orange: #eb6834; --aqua: #1baf7a; --yellow: #eda100; --magenta: #e87ba4; --violet: #4a3aa7;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --up: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --primary: #fff; --secondary: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --blue: #3987e5; --orange: #d95926; --aqua: #199e70; --yellow: #c98500; --magenta: #d55181; --violet: #9085e9;
      --up: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--page); color: var(--primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.4;
  }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .status { font-size: 13px; color: var(--secondary); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .dot.on { background: var(--good); } .dot.off { background: var(--critical); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--secondary); margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tiles { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 14px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 26px; font-weight: 600; }
  .tile .value.hero { font-size: 40px; }
  .tile .sub { font-size: 12px; color: var(--secondary); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .muted { color: var(--muted); }
  .wide { grid-column: 1 / -1; }
  .events { font-size: 12px; max-height: 220px; overflow-y: auto; }
  .events div { padding: 2px 0; border-bottom: 1px solid var(--grid); color: var(--secondary); }
  .events .t { color: var(--muted); }
  input[type=number] { width: 90px; background: var(--page); color: var(--primary); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 6px; font: inherit; }
  label.field { display: inline-flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); margin-right: 12px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tooltip { position: absolute; top: -26px; display: none; pointer-events: none; white-space: nowrap; font-size: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
</style>
</head>
<body>
<header>
  <h1>Bitburner dashboard</h1>
  <span class="status"><span id="conn-dot" class="dot off"></span><span id="conn-text">connecting…</span></span>
  <span class="status" id="updated"></span>
</header>
<div class="grid" id="grid">
  <div class="card wide" id="card-corp"></div>
  <div class="card wide" id="card-income"></div>
  <div class="card" id="card-hacking"></div>
  <div class="card" id="card-darknet"></div>
  <div class="card" id="card-contracts"></div>
  <div class="card" id="card-rep"></div>
</div>

<script>
const BLUE = "var(--blue)", ORANGE = "var(--orange)", AQUA = "var(--aqua)";
const fmtMoney = (n) => {
  if (n == null) return "–";
  const sign = n < 0 ? "-" : ""; n = Math.abs(n);
  const units = [[1e12, "t"], [1e9, "b"], [1e6, "m"], [1e3, "k"]];
  for (const [size, suffix] of units) if (n >= size) return sign + "$" + (n / size).toFixed(2) + suffix;
  return sign + "$" + n.toFixed(0);
};
const fmtNum = (n) => n == null ? "–" : n.toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtInt = (n) => n == null ? "–" : Math.round(n).toLocaleString("en-US");
const el = (id) => document.getElementById(id);
const text = (s) => document.createTextNode(s == null ? "" : String(s));

const fmtClock = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

// Line chart with a log10 y axis and clock-time x ticks. points: [{t, perSecond}] sorted by t.
// Zero values (income right after an install) can't be logged; they sit on the bottom line.
// Returns {svg, geometry}; the geometry lets the hover layer map pointer x to the nearest point.
function logLineChart(points, color, format) {
  const W = 760, H = 210, padL = 64, padR = 16, padT = 12, padB = 26;
  const positive = points.map((p) => p.perSecond).filter((v) => v > 0);
  const minExp = Math.floor(Math.log10(Math.min(...positive)));
  let maxExp = Math.ceil(Math.log10(Math.max(...positive)));
  if (maxExp <= minExp) maxExp = minExp + 1;
  const minX = points[0].t, maxX = points[points.length - 1].t;
  const sx = (t) => padL + (maxX === minX ? 0 : (t - minX) / (maxX - minX)) * (W - padL - padR);
  const sy = (v) => {
    const exponent = v > 0 ? Math.max(minExp, Math.log10(v)) : minExp;
    return H - padB - (exponent - minExp) / (maxExp - minExp) * (H - padT - padB);
  };

  // y ticks: every power of ten; with a narrow range (≤ 2 decades) also 2× and 5×
  const yTicks = [];
  for (let exponent = minExp; exponent <= maxExp; exponent++) {
    for (const factor of maxExp - minExp <= 2 ? [1, 2, 5] : [1]) {
      const value = factor * 10 ** exponent;
      if (Math.log10(value) <= maxExp) yTicks.push({ value, major: factor === 1 });
    }
  }
  const yGrid = yTicks.map(({ value, major }) => `<line x1="${padL}" x2="${W - padR}" y1="${sy(value).toFixed(1)}" y2="${sy(value).toFixed(1)}" stroke="var(--grid)"/>` +
    `<text x="${padL - 6}" y="${(sy(value) + 4).toFixed(1)}" text-anchor="end" fill="var(--muted)" font-size="${major ? 11 : 10}">${format(value).replace(".00", "")}</text>`).join("");

  // x ticks: clock times on whole multiples of a step that gives about 4-9 ticks
  const spanMinutes = (maxX - minX) / 60000;
  const stepMinutes = [5, 10, 15, 30, 60].find((step) => spanMinutes / step <= 9) ?? 60;
  const stepMs = stepMinutes * 60000;
  const xTicks = [];
  for (let t = Math.ceil(minX / stepMs) * stepMs; t <= maxX; t += stepMs) xTicks.push(t);
  const xGrid = xTicks.map((t) => `<line x1="${sx(t).toFixed(1)}" x2="${sx(t).toFixed(1)}" y1="${padT}" y2="${H - padB}" stroke="var(--grid)"/>` +
    `<text x="${sx(t).toFixed(1)}" y="${H - 8}" text-anchor="middle" fill="var(--muted)" font-size="11">${fmtClock(t)}</text>`).join("");

  const path = points.map((p, i) => (i ? "L" : "M") + sx(p.t).toFixed(1) + " " + sy(p.perSecond).toFixed(1)).join(" ");
  const last = points[points.length - 1];
  const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" font-family="system-ui" style="touch-action:none">
    ${yGrid}${xGrid}
    <line x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}" stroke="var(--axis)"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${sx(last.t).toFixed(1)}" cy="${sy(last.perSecond).toFixed(1)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    <g class="hover" style="display:none;pointer-events:none">
      <line class="hover-line" y1="${padT}" y2="${H - padB}" stroke="var(--secondary)" stroke-width="1"/>
      <circle class="hover-dot" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    </g>
    <rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="transparent" class="hover-area"/>
  </svg>`;
  return { svg, geometry: { W, sx, sy } };
}

// Crosshair + tooltip: snaps to the nearest point. Remembers the pointer's position per chart (key), so a hover
// survives the 5 s refresh.
const hoverPositions = {};
function attachHover(container, points, geometry, format, suffix, key) {
  const svgElement = container.querySelector("svg");
  const group = svgElement.querySelector(".hover"), line = svgElement.querySelector(".hover-line"), dot = svgElement.querySelector(".hover-dot");
  const tooltip = container.querySelector(".tooltip");
  const show = (viewX) => {
    let nearest = points[0];
    for (const p of points) if (Math.abs(geometry.sx(p.t) - viewX) < Math.abs(geometry.sx(nearest.t) - viewX)) nearest = p;
    const x = geometry.sx(nearest.t), y = geometry.sy(nearest.perSecond);
    line.setAttribute("x1", x); line.setAttribute("x2", x);
    dot.setAttribute("cx", x); dot.setAttribute("cy", y);
    group.style.display = "";
    tooltip.replaceChildren();
    const value = document.createElement("strong"); value.textContent = format(nearest.perSecond) + suffix;
    const time = document.createElement("span"); time.className = "muted"; time.textContent = " at " + fmtClock(nearest.t);
    tooltip.append(value, time);
    const scale = svgElement.getBoundingClientRect().width / geometry.W;
    tooltip.style.left = Math.min(x * scale + 10, svgElement.getBoundingClientRect().width - 160) + "px";
    tooltip.style.display = "block";
  };
  const hide = () => { group.style.display = "none"; tooltip.style.display = "none"; };
  const toViewX = (event) => (event.clientX - svgElement.getBoundingClientRect().left) / svgElement.getBoundingClientRect().width * geometry.W;
  svgElement.addEventListener("pointermove", (event) => { hoverPositions[key] = toViewX(event); show(hoverPositions[key]); });
  svgElement.addEventListener("pointerleave", () => { delete hoverPositions[key]; hide(); });
  if (hoverPositions[key] !== undefined) show(hoverPositions[key]);
}

// Corporation (services/corp-status.js, every 20 s): headline numbers, investment offer, valuation history, one row per city.
const JOB_SHORT = { Operations: "Ops", Engineer: "Eng", Business: "Bus", Management: "Mgt", "Research & Development": "R&D", Intern: "Int" };
function renderCorporation(corp) {
  const card = el("card-corp");
  if (!corp) { card.style.display = "none"; return; }
  card.style.display = "";
  const c = corp.corporation, offer = corp.offer;
  const profit = c.revenue - c.expenses;
  const ownedPercent = (100 * c.numShares / c.totalShares).toFixed(1);
  const offerTile = offer && offer.funds > 0
    ? tile("Investment offer", fmtMoney(offer.funds), `round ${offer.round} for ${fmtInt(offer.shares / 1e6)}M shares · you hold ${ownedPercent}%`)
    : tile("Investment offer", "–", c.public ? "public: no more rounds" : `you hold ${ownedPercent}%`);
  const tiles = `<div class="tiles">
    ${tile("Valuation", fmtMoney(c.valuation))}
    ${tile("Profit", fmtMoney(profit) + "/s", `revenue ${fmtMoney(c.revenue)}/s · expenses ${fmtMoney(c.expenses)}/s`)}
    ${tile("Funds", fmtMoney(c.funds))}
    ${offerTile}
  </div>`;

  const points = (corp.history || []).map((h) => ({ t: h.t, perSecond: h.valuation })).filter((p) => p.perSecond > 0);
  const chart = points.length >= 2 ? logLineChart(points, BLUE, fmtMoney) : null;

  const warehouses = new Map((corp.warehouses || []).map((w) => [w.division + "|" + w.city, w]));
  const rows = (corp.offices || []).map((office) => {
    const key = office.division + "|" + office.city;
    const jobs = Object.entries(office.employeeJobs || {}).filter(([, n]) => n > 0).map(([job, n]) => `${JOB_SHORT[job] ?? job} ${n}`).join(" ");
    const warehouse = warehouses.get(key);
    const outputs = (corp.materials || []).filter((m) => m.division === office.division && m.city === office.city && m.productionAmount > 0)
      .map((m) => `${esc(m.name)} ${fmtNum(m.productionAmount)}/s, sold ${fmtNum(m.actualSellAmount)}/s`).join("<br>");
    return `<tr><td>${esc(office.division)}</td><td>${esc(office.city)}</td><td>${office.numEmployees}/${office.size} <span class="muted">${esc(jobs)}</span></td>
      <td class="num">${Math.round(office.avgEnergy)} / ${Math.round(office.avgMorale)}</td>
      <td class="num">${warehouse ? `${Math.round(100 * warehouse.sizeUsed / warehouse.size)}% of ${fmtNum(warehouse.size)}` : "none"}</td>
      <td>${outputs || '<span class="muted">–</span>'}</td></tr>`;
  }).join("");
  const divisions = (corp.divisions || []).map((d) => `${esc(d.name)} (${esc(d.industry)}): production ×${d.productionMult.toFixed(1)}, `
    + `${fmtNum(d.researchPoints)} research points, awareness ${fmtNum(d.awareness)}, popularity ${fmtNum(d.popularity)}, ${d.numAdVerts} adverts`).join(" · ");
  const age = Math.round((Date.now() - corp.time) / 1000);

  card.innerHTML = `<h2>Corporation: ${esc(c.name)}</h2>${tiles}
    <div class="muted" style="font-size:12px;margin-bottom:8px">${divisions}${age > 60 ? ` · <b>data ${age} s old: is services/corp-status.js running?</b>` : ""}</div>
    <div class="muted" style="font-size:12px;margin-bottom:4px">Valuation, last 2 h (log scale; the investment offer is 30% of it in round 1)</div>
    <div class="chart" style="position:relative;margin-bottom:12px">${chart ? chart.svg : '<p class="muted">History starts now: one point every 20 s.</p>'}<div class="tooltip"></div></div>
    <table><thead><tr><th>Division</th><th>City</th><th>Employees</th><th class="num">Energy / morale</th><th class="num">Warehouse</th><th>Output</th></tr></thead><tbody>${rows}</tbody></table>`;
  if (chart) attachHover(card.querySelector(".chart"), points, chart.geometry, fmtMoney, "", "valuation");
}

function tile(label, value, sub) {
  return `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
}

function renderIncome(income) {
  const card = el("card-income");
  if (!income) { card.innerHTML = `<h2>Income & hacking</h2><p class="muted">metrics.js not running.</p>`; return; }
  const tiles = `<div class="tiles">
    <div class="tile"><div class="label">Income now</div><div class="value hero">${fmtMoney(income.nowPerSecond)}<span style="font-size:16px">/s</span></div></div>
    <div class="tile"><div class="label">Hacking level</div><div class="value">${fmtInt(income.hackingLevel)}</div></div>
    <div class="tile"><div class="label">Money</div><div class="value">${fmtMoney(income.money)}</div></div>
  </div>`;
  const points = income.points || [];
  const hasData = points.length >= 2 && points.some((p) => p.perSecond > 0);
  const chart = hasData ? logLineChart(points, BLUE, fmtMoney) : null;
  card.innerHTML = `<h2>Income & hacking</h2>${tiles}<div class="muted" style="font-size:12px;margin-bottom:4px">
    Income per second, last 2 h (per-minute average, log scale)</div>
    <div class="chart" style="position:relative">${chart ? chart.svg : '<p class="muted">Not enough data yet.</p>'}<div class="tooltip"></div></div>`;
  if (chart) attachHover(card.querySelector(".chart"), points, chart.geometry, fmtMoney, "/s", "income");
}

function renderHacking(hacking) {
  const card = el("card-hacking");
  if (!hacking) { card.innerHTML = `<h2>Batcher</h2><p class="muted">No state.txt — batcher not running (or controller mode).</p>`; return; }
  const t = hacking.threads || {}, share = hacking.share || {}, c = hacking.counters || {};
  const usedPct = t.total ? Math.round(100 * (t.total - t.free) / t.total) : null;
  const modes = Object.entries(hacking.modeCounts || {}).map(([m, n]) => `${n} ${m}`).join(" · ");
  const tiles = `<div class="tiles">
    <div class="tile"><div class="label">Thread slots used</div><div class="value">${usedPct == null ? "–" : usedPct + "%"}</div><div class="sub">${fmtNum(t.total - t.free)} / ${fmtNum(t.total)}</div></div>
    <div class="tile"><div class="label">Share threads</div><div class="value">${fmtNum(share.threads)}</div><div class="sub">share power ${share.power ? share.power.toFixed(2) : "–"}</div></div>
  </div>`;
  const rows = (hacking.targets || []).slice(0, 10).map((target) => `<tr>
    <td>${esc(target.target)}</td><td>${esc(target.mode)}</td>
    <td class="num">${fmtMoney(target.moneyPerSecond)}/s</td>
    <td class="num">${fmtNum(target.threads)}</td>
    <td class="num">${target.moneyPercent == null ? "–" : target.moneyPercent + "%"}</td></tr>`).join("");
  card.innerHTML = `<h2>Batcher</h2>${tiles}
    <div class="muted" style="font-size:12px;margin-bottom:8px">targets: ${modes} · batches ${fmtNum(c.batches)} · desyncs ${fmtNum(c.desyncs)} · cancelled ${fmtNum(c.cancelled)}</div>
    <table><thead><tr><th>Target</th><th>Mode</th><th class="num">$/s</th><th class="num">Threads</th><th class="num">Money</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderDarknet(darknet) {
  const card = el("card-darknet");
  if (!darknet) { card.innerHTML = `<h2>Darknet</h2><p class="muted">No darknet.txt yet.</p>`; return; }
  const last = darknet.sweeps[darknet.sweeps.length - 1];
  const tiles = last ? `<div class="tiles">
    <div class="tile"><div class="label">Servers reached</div><div class="value">${last.reached}</div></div>
    <div class="tile"><div class="label">Phishing threads</div><div class="value">${last.threads}</div><div class="sub">${last.phishers} servers</div></div>
    <div class="tile"><div class="label">Karma</div><div class="value">${last.karma}</div></div>
    <div class="tile"><div class="label">Caches found</div><div class="value">${darknet.counts.cache || 0}</div></div>
  </div>` : `<p class="muted">No sweep yet.</p>`;
  const events = (darknet.recentCaches.concat(darknet.recentEvents)).slice(0, 10)
    .map((e) => `<div><span class="t">${esc(e.time.slice(11))}</span> <b>${esc(e.type)}</b> ${esc(e.details.slice(0, 90))}</div>`).join("");
  card.innerHTML = `<h2>Darknet</h2>${tiles}<div class="events">${events || '<div class="muted">no events</div>'}</div>`;
}

function renderContracts(contracts) {
  const card = el("card-contracts");
  if (!contracts) { card.innerHTML = `<h2>Coding contracts</h2><p class="muted">No coding-contracts.txt yet.</p>`; return; }
  const r = contracts.byReward || {};
  const tiles = `<div class="tiles">
    <div class="tile"><div class="label">Solved</div><div class="value">${fmtInt(contracts.solved)}</div></div>
    <div class="tile"><div class="label">Failed</div><div class="value">${fmtInt(contracts.failed)}</div></div>
  </div>
  <div class="muted" style="font-size:12px;margin-bottom:8px">rewards: ${(r["faction reputation"]||0)} faction rep · ${(r["company reputation"]||0)} company rep · ${(r.money||0)} money</div>`;
  const rows = (contracts.recent || []).map((e) => `<div><span class="t">${esc(e.time.slice(11))}</span> ${esc(e.details.slice(0, 110))}</div>`).join("");
  card.innerHTML = `<h2>Coding contracts</h2>${tiles}<div class="events">${rows || '<div class="muted">none yet</div>'}</div>`;
}

// Reputation & favor: scripts can't read faction favor/rep without Source-File 4, so the user types the numbers
// once; the card then extrapolates rep at the given rate every second. Saved in localStorage with the entry time.
// Favor after an install comes from the cumulative rep: rep = 25000 * (1.02^favor - 1).
const favorToRep = (favor) => 25000 * (Math.pow(1.02, favor) - 1);
const repToFavor = (rep) => Math.log(rep / 25000 + 1) / Math.log(1.02);
const REP_FIELDS = ["rep-favor", "rep-current", "rep-rate", "rep-goal-favor", "rep-goal"];
let repEnteredAt = Date.now();

function renderRepCard() {
  const card = el("card-rep");
  if (card.dataset.built) return;
  card.dataset.built = "1";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("rep") || "{}"); } catch {}
  repEnteredAt = saved.enteredAt ?? Date.now();
  const field = (id, label, value) => `<label class="field">${label}<input type="number" id="${id}" value="${value ?? ""}"></label>`;
  card.innerHTML = `<h2>Reputation & favor</h2>
    <div style="margin-bottom:12px">
      ${field("rep-favor", "Favor now", saved.favor)}${field("rep-current", "Rep this run", saved.current)}${field("rep-rate", "Rate /s", saved.rate)}
    </div>
    <div style="margin-bottom:12px">
      ${field("rep-goal-favor", "Goal favor", saved.goalFavor ?? 150)}${field("rep-goal", "Goal rep (optional)", saved.goal)}
    </div>
    <div id="rep-result"></div>
    <p class="muted" style="font-size:12px">Type the numbers from the faction page once; rep is extrapolated at the rate from then on.
      Favor after install = favor of (rep the current favor stands for + rep this run). 150 favor unlocks donations.</p>`;
  for (const id of REP_FIELDS) el(id).addEventListener("input", () => {
    repEnteredAt = Date.now();
    const value = (fieldId) => el(fieldId).value === "" ? undefined : +el(fieldId).value;
    try {
      localStorage.setItem("rep", JSON.stringify({ favor: value("rep-favor"), current: value("rep-current"), rate: value("rep-rate"),
        goalFavor: value("rep-goal-favor"), goal: value("rep-goal"), enteredAt: repEnteredAt }));
    } catch {}
    updateRepResult();
  });
  updateRepResult();
  setInterval(updateRepResult, 1000);
}

const formatDuration = (seconds) => {
  const minutes = seconds / 60;
  return minutes >= 60 ? `${Math.floor(minutes / 60)} h ${Math.round(minutes % 60)} min` : `${Math.max(1, Math.round(minutes))} min`;
};

function updateRepResult() {
  const favor = +el("rep-favor").value || 0, rate = +el("rep-rate").value || 0;
  const goalFavor = +el("rep-goal-favor").value || 150, goalRep = +el("rep-goal").value || 0;
  const repNow = (+el("rep-current").value || 0) + rate * (Date.now() - repEnteredAt) / 1000;
  const favorAfterInstall = repToFavor(favorToRep(favor) + repNow);
  const neededForGoalFavor = favorToRep(goalFavor) - favorToRep(favor) - repNow;
  const progress = Math.min(1, (favorToRep(favor) + repNow) / favorToRep(goalFavor));
  const eta = (remaining) => remaining <= 0 ? "reached" : rate > 0
    ? `${formatDuration(remaining / rate)} (${new Date(Date.now() + remaining / rate * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })})`
    : "enter a rate";
  const tile = (label, value, sub) => `<div class="tile"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  el("rep-result").innerHTML = `
    <div class="tiles">
      ${tile("Rep now (estimated)", fmtInt(repNow))}
      ${tile("Favor after install", favorAfterInstall.toFixed(1), `now ${favor}`)}
      ${tile(`Rep to ${goalFavor} favor`, fmtInt(Math.max(0, neededForGoalFavor)), eta(neededForGoalFavor))}
      ${goalRep ? tile(`Rep to ${fmtInt(goalRep)}`, fmtInt(Math.max(0, goalRep - repNow)), eta(goalRep - repNow)) : ""}
    </div>
    <div title="${Math.round(progress * 100)}% of the rep for ${goalFavor} favor" style="height:8px;border-radius:4px;background:var(--grid);overflow:hidden">
      <div style="height:100%;width:${(progress * 100).toFixed(1)}%;background:var(--blue);border-radius:4px"></div>
    </div>`;
}

function esc(s) { const d = document.createElement("div"); d.appendChild(text(s)); return d.innerHTML; }

async function tick() {
  try {
    const data = await (await fetch("/dashboard/data")).json();
    el("conn-dot").className = "dot " + (data.connected ? "on" : "off");
    el("conn-text").textContent = data.connected ? "game connected" : "game not connected";
    el("updated").textContent = "updated " + new Date().toLocaleTimeString();
    if (data.connected) {
      renderCorporation(data.corporation); renderIncome(data.income); renderHacking(data.hacking);
      renderDarknet(data.darknet); renderContracts(data.contracts);
    }
    renderRepCard();
  } catch (e) {
    el("conn-text").textContent = "bridge unreachable";
    el("conn-dot").className = "dot off";
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
